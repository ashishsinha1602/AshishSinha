# Render Blueprint — one file that provisions the whole hosted demo:
# a free web service running webdemo.py + a free PostgreSQL database.
#
# Deploy: Render dashboard → New → Blueprint → pick this repo + branch.
# Render reads this file, creates both services, wires DATABASE_URL between
# them, and webdemo.py auto-seeds the database on first boot.

services:
  - type: web
    name: db-detective-demo
    runtime: python
    plan: free
    branch: db-detective
    buildCommand: pip install -r requirements.txt
    startCommand: python webdemo.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db-detective-pg
          property: connectionString

databases:
  - name: db-detective-pg
    plan: free
